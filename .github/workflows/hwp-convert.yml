name: Convert HWP to HWPX

on:
  workflow_dispatch:
    inputs:
      importId:
        description: "Supabase weekly_imports.id"
        required: true
      storagePath:
        description: "R2 object key of the uploaded .hwp (e.g. weeklies/imports/<id>.hwp)"
        required: true

concurrency:
  group: hwp-convert-${{ inputs.importId }}
  cancel-in-progress: false

# 파일은 R2(S3 호환)에, DB 행은 Supabase 에 있다.
# R2 접근은 curl 내장 SigV4(--aws-sigv4)를 쓴다 — aws CLI 는 버전에 따라
# 추가 checksum 헤더를 붙여 S3 호환 스토리지에서 깨질 수 있어 피한다.
env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_CREDS: ${{ secrets.R2_ACCESS_KEY_ID }}:${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install LibreOffice
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice
          soffice --version

      - name: Download .hwp from R2
        env:
          STORAGE_KEY: ${{ inputs.storagePath }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -sS -f \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_CREDS" \
            "$R2_ENDPOINT/$R2_BUCKET/$STORAGE_KEY" \
            -o work/input.hwp
          ls -la work

      - name: Convert .hwp → .hwpx
        run: |
          cd work
          soffice --headless --convert-to hwpx input.hwp || true
          if [ ! -f input.hwpx ]; then
            echo "::error::soffice 가 .hwpx 출력을 생성하지 못했습니다."
            exit 1
          fi
          ls -la

      - name: Upload .hwpx back to R2
        env:
          IMPORT_ID: ${{ inputs.importId }}
        run: |
          set -euo pipefail
          # key 규칙은 src/lib/r2/keys.ts 의 weeklyImportKey() 와 동일해야 한다.
          # 원본은 7일 후 cron 이 지우므로 CDN 캐시를 붙이지 않는다.
          curl -sS -f -X PUT \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_CREDS" \
            -H "Content-Type: application/vnd.hancom.hwpx+zip" \
            -H "Cache-Control: private, max-age=0, no-store" \
            --data-binary "@work/input.hwpx" \
            "$R2_ENDPOINT/$R2_BUCKET/weeklies/imports/$IMPORT_ID.hwpx"

      - name: Notify backend to parse the converted .hwpx
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          IMPORT_ID: ${{ inputs.importId }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"importId\":\"$IMPORT_ID\"}" \
            "$APP_URL/api/admin/weeklies/import-hwp-finalize"

      - name: Mark failed (on error)
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPORT_ID: ${{ inputs.importId }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $SERVICE_ROLE" \
            -H "apikey: $SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{"status":"failed","error_message":"GitHub Actions 변환 실패 — 작업 로그 참조"}' \
            "$SUPABASE_URL/rest/v1/weekly_imports?id=eq.$IMPORT_ID"
