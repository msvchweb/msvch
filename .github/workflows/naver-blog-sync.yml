name: Naver blog sync

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (한국시간 기준 03:00 / 09:00 / 15:00 / 21:00)
  workflow_dispatch:          # 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
      # npm ci 대신 npm install 을 쓰는 이유:
      # @rolldown/binding-wasm32-wasi 가 @emnapi/core 를 정확히 1.11.1 로 고정 요구하는데,
      # 개발 환경(Windows)에서는 이 wasm 대체 패키지를 설치하지 않아 npm 이 해당 하위 트리를
      # lock 에 기록하지 않는다. 그 결과 lock 은 Linux 러너에서 npm ci 검증을 통과하지 못한다.
      # (--os/--cpu 플래그, 전체 재생성 모두 시도했으나 Windows 에서는 재현 불가)
      # 이 두 워크플로는 재현성보다 동작이 중요하므로 install 로 둔다.
        run: npm install --no-audit --no-fund

      - name: Run Naver blog sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXT_PUBLIC_CDN_BASE_URL: ${{ secrets.NEXT_PUBLIC_CDN_BASE_URL }}
        run: npx tsx scripts/naver-blog-sync.ts
