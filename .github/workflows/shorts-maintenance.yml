name: Reconcile shorts generation and discover sermons
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: shorts-maintenance
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Lockfile verified with clean Node 24 installs on Windows and Linux.
      - run: npm ci --no-audit --no-fund
      - name: Reconcile terminal runs and enqueue eligible sermons
        env:
          GITHUB_PAT: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SHORTS_SOURCE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: node --import tsx scripts/shorts/maintenance.ts
