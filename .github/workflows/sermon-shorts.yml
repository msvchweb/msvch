name: Generate sermon shorts
run-name: Shorts ${{ inputs.attemptId }}
on:
  workflow_dispatch:
    inputs:
      videoId:
        description: YouTube video ID
        required: true
      jobId:
        description: Shorts job ID
        required: true
      attemptId:
        description: Queued generation attempt ID
        required: true
      count:
        description: Number of clips
        type: choice
        options: ["5", "10"]
        default: "5"
permissions:
  contents: read
concurrency:
  group: sermon-shorts
  cancel-in-progress: false
  queue: max
jobs:
  generate:
    runs-on: [self-hosted, windows, shorts]
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VIDEO_ID: ${{ inputs.videoId }}
      JOB_ID: ${{ inputs.jobId }}
      ATTEMPT_ID: ${{ inputs.attemptId }}
      CLIP_COUNT: ${{ inputs.count }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      NEXT_PUBLIC_CDN_BASE_URL: ${{ secrets.NEXT_PUBLIC_CDN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Retain install until the lockfile has also passed npm ci on Linux.
      - name: Install dependencies
        shell: powershell
        run: npm install --no-audit --no-fund
      - name: Preflight
        shell: powershell
        run: node --import tsx scripts/shorts/preflight.ts
      - name: Generate clips
        shell: powershell
        run: node --import tsx scripts/shorts/run.ts --videoId="$env:VIDEO_ID" --jobId="$env:JOB_ID" --attemptId="$env:ATTEMPT_ID" --count="$env:CLIP_COUNT"
      - name: Record failure
        if: failure()
        shell: powershell
        run: node --import tsx scripts/shorts/finalize-attempt.ts
