name: Generate sermon shorts

on:
  workflow_dispatch:
    inputs:
      videoId:
        description: "YouTube video ID"
        required: true
      jobId:
        description: "Supabase shorts_jobs.id"
        required: true

concurrency:
  group: sermon-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, windows, shorts]
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Preflight - verify toolchain
        shell: powershell
        run: |
          yt-dlp --version
          ffmpeg -version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Run shorts pipeline
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/shorts/run.ts `
            --videoId="${{ inputs.videoId }}" `
            --jobId="${{ inputs.jobId }}"
