name: Generate sermon shorts

on:
  workflow_dispatch:
    inputs:
      videoId:
        description: "YouTube video ID"
        required: true
      jobId:
        description: "Supabase shorts_jobs.id"
        required: true
      count:
        description: "Number of highlights (5 or 10)"
        required: false
        default: "5"

concurrency:
  group: sermon-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, windows, shorts]
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Preflight - verify toolchain
        shell: powershell
        run: |
          yt-dlp --version
          ffmpeg -version

      - name: Install dependencies
        shell: powershell
      # npm ci 대신 npm install 을 쓰는 이유:
      # @rolldown/binding-wasm32-wasi 가 @emnapi/core 를 정확히 1.11.1 로 고정 요구하는데,
      # 개발 환경(Windows)에서는 이 wasm 대체 패키지를 설치하지 않아 npm 이 해당 하위 트리를
      # lock 에 기록하지 않는다. 그 결과 lock 은 Linux 러너에서 npm ci 검증을 통과하지 못한다.
      # (--os/--cpu 플래그, 전체 재생성 모두 시도했으나 Windows 에서는 재현 불가)
      # 이 두 워크플로는 재현성보다 동작이 중요하므로 install 로 둔다.
        run: npm install --no-audit --no-fund

      - name: Run shorts pipeline
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXT_PUBLIC_CDN_BASE_URL: ${{ secrets.NEXT_PUBLIC_CDN_BASE_URL }}
        run: |
          npx tsx scripts/shorts/run.ts `
            --videoId="${{ inputs.videoId }}" `
            --jobId="${{ inputs.jobId }}" `
            --count="${{ inputs.count }}"
